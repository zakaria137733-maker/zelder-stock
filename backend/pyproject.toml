[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires live Mongo/Influx/Redis services (docker-compose or CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
